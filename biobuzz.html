<!DOCTYPE html>
<html>

<head>
  <title>FTC RuleBook Search - Biobuzz</title>
  <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="SearchSharkLogo.png">

</head>

<body>

  <script src="header.js"></script>

<div class="page-title">
  FTC RuleBook Search - Biobuzz
</div>
  <div class="welcome-box">
    <h2>Ask the Search Shark!</h2>
    <p>
      Ask questions about FTC gameplay, tournaments,
      penalties, alliance selection, robot rules, and more.
    </p>
  </div>

  <div id="responseText" class="response-text"></div>

  <input
    id="searchBox"
    placeholder="Ask the Search Shark..."
  >

  <div id="results"></div>

  <div class="suggestions">

    <button onclick="fillSearch('Advancement Points')">Advancement Points</button>
    <button onclick="fillSearch('Size')">Size</button>
    <button onclick="fillSearch('Alliance Selection')">Alliance Selection</button>
    <button onclick="fillSearch('Yellow Cards')">Yellow Cards</button>
    <button onclick="fillSearch('Scoring')">Scoring</button>

  </div>

  <!-- LOAD SEARCH ENGINE -->
  <script src="biobuzzsearch.js"></script>

</body>
</html>
