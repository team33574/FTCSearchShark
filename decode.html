<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title> FTC Search Shark - Decode</title>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="SearchSharkLogo.png">
</head>

<body>

  <!-- HEADER -->
  <script src="header.js" defer></script>

  <!-- NOTES SIDEBAR -->
<div id="notesSidebar" class="notes-sidebar">
    <button id="closeNotesBtn">X</button>

    <div class="notes-header"> Notes</div>

    <textarea id="notesBox" placeholder="Write rule names, strategies, reminders..."></textarea>

    <button id="saveNotesBtn">Save Notes</button>

    <!-- SAVED INDICATOR (ONLY ONCE — FIXED) -->
    <div id="notesStatus" class="notes-status"></div>

    <button id="clearNotesBtn">Clear</button>

  </div>

  <!-- NOTES TOGGLE -->
  <button id="notesToggleBtn" class="notes-toggle">
    Notes
  </button>

  <!-- TITLE -->
  <div class="page-title">
    FTC RuleBook Search - Decode
  </div>

  <!-- INTRO -->
  <div class="welcome-box">
    <h2>Ask the Search Shark!</h2>
    <p>
      Ask questions or search for keywords about FTC gameplay, tournaments, penalties,
      alliance selection, robot rules, and more.
    </p>
  </div>

  <!-- SEARCH STATUS -->
  <div id="responseText" class="response-text"></div>

  <!-- SEARCH INPUT -->
  <input id="searchBox" placeholder="Ask the Search Shark..." autocomplete="off">

  <!-- RESULTS -->
  <div id="results"></div>

  <!-- SUGGESTIONS -->
  <div class="suggestions">

    <button onclick="fillSearch('Advancement Points')">Advancement Points</button>
    <button onclick="fillSearch('Robot Dimensions and Accuracy')">Robot Dimensions</button>
    <button onclick="fillSearch('Alliance Selection')">Alliance Selection</button>
    <button onclick="fillSearch('Yellow Cards')">Yellow Cards</button>
    <button onclick="fillSearch('Scoring')">Scoring</button>

  </div>

  <!-- MANUAL LINK -->
  <div class="box manual-link">

    <h2>Official Decode Game Manual</h2>

    <p>
      Click below to open the official FTC rulebook.
    </p>

    <a href="https://ftc-resources.firstinspires.org/ftc/game/manual" target="_blank">
      Open Official FTC Game Manual →
    </a>

  </div>

  <!-- ANSWER MODE UI -->
  <div id="answerPanel"></div>
  <button id="answerModeBtn">Answer Mode: OFF</button>

  <!-- MAIN JS -->
  <script src="decodesearch.js" defer></script>

</body>

</html>
